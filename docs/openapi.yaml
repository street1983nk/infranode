            Case-insensitive substring filter on the stop name (stop_name),
            e.g. alsterdorf.
          schema:
            type: string
        - name: near
          in: query
          required: false
          description: >-
            "lat,lon"; liefert nur Haltestellen im Umkreis, aufsteigend nach
            Distanz sortiert. Ungültige Werte -> 400.
          x-description-en: >-
            "lat,lon"; returns only stops within the radius, sorted by distance
            ascending. Invalid values -> 400.
          schema:
            type: string
        - name: radius_m
          in: query
          required: false
          description: Suchradius für near in Metern (Default 1000).
          x-description-en: Search radius for near in metres (default 1000).
          schema:
            type: integer
            default: 1000
        - name: page
          in: query
          required: false
          description: >-
            Seitennummer der Default-Paginierung ohne q/near (Default 50 Einträge,
            Cap 200); meta.pagination weist total/returned/limit/offset/truncated aus.
          x-description-en: >-
            Page number of the default pagination without q/near (default 50
            entries, cap 200); meta.pagination reports
            total/returned/limit/offset/truncated.
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          description: >-
            Einträge pro Seite der Default-Paginierung ohne q/near (Default 50,
            Cap 200).
          x-description-en: >-
            Entries per page of the default pagination without q/near (default
            50, cap 200).
          schema:
            type: integer
      responses:
        "200":
          description: >-
