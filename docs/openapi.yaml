        installierbare Dach-PV-Potenzial (potential_kwp, potential_yield_mwh), den
        bereits installierten Bestand (installed_kwp, installed_yield_mwh), den
        Ausschöpfungsgrad (exploitation_pct) und die Aufschlüsselung des Potenzials
        je Gebäudekategorie (potential_by_category). Der Umfang variiert je Quelle
        (z.B. Hamburg nur Potenzial, keine Kategorien). Anders als /solar
        (PVGIS-Einstrahlung je kWp) trägt diese Route die Mengen je Stadt.
        Teilabgedeckt, föderiert je Bundesland: Toggle aus -> 200
        source_status="disabled"; Stadt außerhalb der abgedeckten Länder -> 200
        source_status="not_covered" (mit covered_cities); abgedeckte Stadt ohne
        Seed-Eintrag -> 200 source_status="no_data".
