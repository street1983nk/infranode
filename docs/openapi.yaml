openapi: 3.1.0
info:
  title: InfraNode API
  version: 1.0.0
  description: >-
    Open-Source-Proxy-REST-API für normalisierte offene Daten deutscher
    Großstädte. Bekannt sind 84 Städte über 100.000 Einwohner, davon 28
    Kern-Städte mit voller Quellen-Abdeckung; weitere Städte werden über
    AGS- und geobasierte Quellen bedient. Jede Antwort folgt demselben
    kanonischen Envelope (data/meta/attribution) mit Lizenz-Tag und ehrlichem
    source_status (ok/no_data/disabled/not_covered). Teilabgedeckte Endpunkte
    (flood, webcams, traffic, road-events) liefern für eine nicht-abgedeckte
    Stadt 200 source_status="not_covered" + meta.covered_cities statt eines
    leeren "ok"; die Abdeckung listet die Seite /abdeckung. Pfade tragen den vollen
    /api/v1-Prefix, damit die ausgelieferte Spec driftfrei zu den live
    registrierten Routen bleibt. Paginierung ist kanal-abhängig: direktes REST
    liefert Datenart-Listen voll, GPT-Actions und MCP sind serverseitig bzw.
    client-seitig auf ein Default-Limit gebunden; limit=all (bzw. ?all=1) erzwingt
    kanalunabhängig die Vollausgabe. Details siehe meta.pagination (Meta-Schema).
    Der Stadt-Slug im Pfad wird tolerant aufgelöst: der deutsche Name mit oder
    ohne Umlaute, beliebige Groß/Kleinschreibung, gängige englische Exonyme und
    Kurzformen führen zum kanonischen Slug (München/münchen/munich/munchen ->
    muenchen, cologne -> koeln, frankfurt -> frankfurt-am-main). Ein unbekannter
    Name liefert 404 mit einem "Meintest du ...?"-Hinweis auf den nächstliegenden
    Slug; die kanonischen Slugs listet GET /api/v1/cities.
    Feldnamen-Konvention (seit 2026-07-25 vereinheitlicht): Felder heissen
    durchgaengig snake_case und englisch. Gleiche Konzepte tragen ueberall
    denselben Namen: post_code (immer fuenfstelliger String, fuehrende Null
    bleibt erhalten), street, house_number, place, name, start, end,
    distance_km, power_kw, lat/lon. Fehlt eine Angabe in der Quelle, ist das
    Feld null statt Leerstring. Zeitstempel tragen immer eine Zeitzone.
    Uebergangsweise stehen die frueheren Namen (plz, zip, strasse, hausnummer,
    ort, city, bezeichnung, beginn, ende, art, dist_km, leistung_kw,
    einheit_typ sowie die camelCase-Rohfelder des Autobahn-Feeds) mit
    identischem Wert daneben; sie sind ABGEKUENDIGT und werden fruehestens 30
    Tage nach der Ankuendigung im Changelog entfernt.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://infranode.dev
    description: Öffentliche gehostete API, keylos (Standard)
  - url: http://localhost
    description: Lokaler Caddy-Ingress (Docker Compose)
tags:
  - name: meta
    description: Meta- und Diagnose-Routen (Health, Ping, Source-Status, Spec)
  - name: cities
    description: Stadt-Register und normalisierte Stadt-Stammdaten
  - name: compare
    description: Multi-City-Vergleich einer Ressource über mehrere Städte
  - name: Live
    description: >-
      Getrennte Live-Kategorie unter /api/v1/live. Minutenfrische bzw.
      quasi-live Quellen mit eigenem Envelope-Kennzeichen: meta.as_of
      (Datenstand) und meta.refresh_seconds (Kadenz). Re-exponiert zusätzlich
      bestehende Live-Endpunkte (air, air-uba, water-level, traffic, webcams,
      flood); deren Altpfade unter /api/v1/cities bleiben als Deprecation-Alias
      erhalten (kein Breaking Change).
  - name: stations
    description: >-
      Per-Bahnhof-Live-Boards unter /api/v1/stations/{eva}. Abfahrten/Ankünfte
      JEDES DB-Bahnhofs über seine EVA-Nummer (aus dem Katalog
      /cities/{slug}/stations), alle Gattungen inkl. Nahverkehr, mit Echtzeit-
      Verspätung und Störungen/Meldungen. Quelle: DB Timetables (CC BY 4.0).
paths:
  /api/v1/health:
    get:
      tags: [meta]
      summary: Liveness und Readiness der App prüfen
      x-summary-en: Check app liveness and readiness
      description: >-
        Liefert den App-Status und die Redis-Erreichbarkeit. Gedacht für
        Uptime-Monitore und Load-Balancer-Probes: antwortet mit 200, sobald die
        App bereit ist, sonst mit einem Fehlerstatus.
      x-description-en: >-
        Returns the app status and Redis reachability. Designed for uptime
        monitors and load-balancer probes: responds with 200 once the app is
        ready, otherwise with an error status.
      operationId: getHealth
      responses:
        "200":
          description: App läuft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/sources:
    get:
      tags: [meta]
      summary: Status aller Upstream-Quellen
      x-summary-en: Status of all upstream sources
      description: >-
        Listet je bekannter Quelle den enabled-Zustand (aus den Settings) und
        den Circuit-Breaker-Zustand (CLOSED/OPEN/HALF_OPEN). So ist auf einen
        Blick sichtbar, welche Quelle gerade liefert und welche pausiert ist.
      x-description-en: >-
        Lists each known source with its enabled state (from settings) and its
        circuit-breaker state (CLOSED/OPEN/HALF_OPEN). Shows at a glance which
        source is currently serving and which is paused.
      operationId: getSources
      responses:
        "200":
          description: Liste der Quellen-Status
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SourceStatus"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "304":
          $ref: "#/components/responses/NotModified"
      parameters:
        - in: header
          name: If-None-Match
          required: false
          schema: { type: string }
          description: >-
            Conditional GET. Stimmt der Wert mit dem aktuellen ETag überein,
            antwortet der Server mit 304 Not Modified ohne Body.
          x-description-en: >-
            Conditional GET. If the value matches the current ETag, the server
            responds with 304 Not Modified and no body.
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, default: 50 }
          description: >-
            Seitengröße. Wird auf MAX_LIMIT (200) gedeckelt: zu große Werte
            liefern eine 200er-Seite mit 200 Einträgen statt eines Fehlers.
          x-description-en: >-
            Page size. Capped at MAX_LIMIT (200): larger values return a 200 page
            of 200 items instead of an error.
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
          description: Ein zu großer Offset liefert eine leere Seite (200), nie 500.
          x-description-en: An offset past the end returns an empty page (200), never 500.
        - in: query
          name: sort
          schema: { type: string, enum: [source, enabled, license] }
          description: >-
            Nur die gelisteten Felder sind erlaubt; ein unbekanntes Feld wird mit
            400 (invalid_request) abgewiesen, bevor es ausgewertet wird.
          x-description-en: >-
            Only the listed fields are allowed; an unknown field is rejected with
            400 (invalid_request) before it is evaluated.
        - in: query
          name: order
          schema: { type: string, enum: [asc, desc], default: asc }
  /api/v1/compare:
    get:
      tags: [compare]
      summary: Eine Ressource über mehrere Städte vergleichen
      x-summary-en: Compare one resource across multiple cities
      description: >-
        Vergleicht EINE Ressource (resource) über mehrere Städte (cities,
        kommasepariert) in einer einzigen Antwort. Jede Stadt trägt einen eigenen
        source_status (ok/disabled/no_data/error/not_found); eine fehlende oder
        tote Stadt-Quelle führt nicht zu einem Gesamt-5xx, sondern wird pro Stadt
        ehrlich ausgewiesen. resource wird gegen eine feste Liste geprüft
        (unbekannt -> 400). Neben weather/air sind auch indicators,
        demographics, unemployment, tourism, charging-status und
        weather-warnings vergleichbar. Das Ergebnis ist paginierbar
        (page/limit/offset/sort).
      x-description-en: >-
        Compares ONE resource across multiple cities (comma-separated) in a
        single response. Each city carries its own source_status
        (ok/disabled/no_data/error/not_found); a missing or dead city source does
        not cause an overall 5xx but is reported honestly per city. resource is
        checked against a fixed list (unknown -> 400). Besides weather/air,
        indicators, demographics, unemployment, tourism, charging-status and
        weather-warnings can be compared as well. The result is paginated
        (page/limit/offset/sort).
      operationId: compareCities
      parameters:
        - in: query
          name: cities
          required: true
          schema: { type: string }
          example: berlin,koeln,hamburg
          description: Kommaseparierte Stadt-Slugs (auf MAX_CITIES begrenzt).
          x-description-en: Comma-separated city slugs (limited to MAX_CITIES).
        - in: query
          name: resource
          required: true
          schema: { type: string, enum: [weather, air, indicators, demographics, unemployment, tourism, charging-status, weather-warnings] }
          description: >-
            Zu vergleichende Ressource; unbekannt -> 400 invalid_request.
            weather/air = Live-Adapter (DWD/UBA); indicators, demographics,
            unemployment, tourism, charging-status und weather-warnings
            delegieren an die jeweiligen Stadt-Endpunkte (identisches
            Verhalten inkl. Attribution). charging-status liefert im Compare
            nur die Aggregate (points_omitted statt Einzelpunkt-Liste).
          x-description-en: >-
            Resource to compare; unknown -> 400 invalid_request. weather/air =
            live adapters (DWD/UBA); indicators, demographics, unemployment,
            tourism, charging-status and weather-warnings delegate to the
            per-city endpoints (identical behaviour incl. attribution).
            charging-status returns aggregates only in compare
            (points_omitted instead of the point list).
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: sort
          schema: { type: string, enum: [city, source_status] }
        - in: query
          name: order
          schema: { type: string, enum: [asc, desc], default: asc }
        - in: header
          name: If-None-Match
          required: false
          schema: { type: string }
          description: >-
            Conditional GET; If-None-Match == ETag -> 304 Not Modified ohne Body.
          x-description-en: >-
            Conditional GET; If-None-Match == ETag -> 304 Not Modified with no body.
      responses:
        "200":
          description: Vergleichsliste mit per-Stadt source_status
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [city, source_status]
                      properties:
                        city: { type: string }
                        data: { type: object, nullable: true }
                        source_status:
                          type: string
                          enum: [ok, disabled, no_data, error, not_found]
                  meta:
                    $ref: "#/components/schemas/Meta"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: Unbekannte resource oder leeres cities (invalid_request)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/openapi.yaml:
    get:
      tags: [meta]
      summary: Diese OpenAPI-Spec als YAML
      x-summary-en: This OpenAPI spec as YAML
      description: >-
        Liefert die handgepflegte Spec als application/yaml. FastAPI serviert
        intern nur /openapi.json; diese Route stellt die stabile YAML-Variante
        bereit.
      x-description-en: >-
        Returns the hand-maintained spec as application/yaml. FastAPI internally
        serves only /openapi.json; this route provides the stable YAML variant.
      operationId: getOpenapiYaml
      responses:
        "200":
          description: Die Spec als YAML
          content:
            application/yaml:
              schema:
                type: string
  /api/v1/cities:
    get:
      tags: [cities]
      summary: Alle bekannten Städte auflisten
      x-summary-en: List all known cities
      description: >-
        Listet die Einträge des Stadt-Registers: 84 deutsche Großstädte über
        100.000 Einwohner, davon 28 Kern-Städte mit voller Quellen-Abdeckung.
        Jeder Eintrag trägt den Slug, den du als {slug}-Pfadparameter in allen
        weiteren Endpunkten verwendest.
      x-description-en: >-
        Lists the entries of the city register: 84 German cities with more than
        100,000 inhabitants, 28 of them core cities with full source coverage.
        Each entry carries the slug you use as the {slug} path parameter in all
        other endpoints.
      operationId: getCities
      responses:
        "200":
          description: Stadt-Liste
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    $ref: "#/components/schemas/Meta"
  /api/v1/cities/{slug}:
    get:
      tags: [cities]
      summary: Eine Stadt aus dem Register holen
      x-summary-en: Get a single city from the register
      description: >-
        Liefert den Register-Eintrag zur Stadt mit dem angegebenen {slug}. Ein
        unbekannter Slug löst den 404-Fehler-Envelope aus, dessen Hint auf die
        Stadt-Liste verweist.
      x-description-en: >-
        Returns the register entry for the city with the given {slug}. An unknown
        slug triggers the 404 error envelope whose hint points to the city list.
      operationId: getCity
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stadt-Eintrag
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Unbekannte Stadt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/cities/{slug}/base:
    get:
      tags: [cities]
      summary: Stadt-Stammdaten aus Wikidata
      x-summary-en: City master data from Wikidata
      description: >-
        Liefert Einwohnerzahl, Fläche und Geo-Koordinaten einer Stadt aus
        Wikidata im kanonischen Envelope mit Attribution und Lizenz-Tag. Ist die
        Quelle deaktiviert, antwortet die Route mit 200, data=null und
        meta.source_status="disabled" (nie 5xx). Ist der Upstream tot und liegt
        kein zwischengespeicherter Wert vor, kommt 503 mit einem Hint auf
        GET /api/v1/health.
      x-description-en: >-
        Returns a city's population, area and geo coordinates from Wikidata in
        the canonical envelope with attribution and license tag. If the source
        is disabled, the route responds with 200, data=null and
        meta.source_status="disabled" (never 5xx). If the upstream is down and no
        cached value exists, it returns 503 with a hint pointing to
        GET /api/v1/health.
      operationId: getCityBase
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >-
            Stammdaten-Envelope. data ist der CanonicalRecord oder null, wenn die
            Quelle deaktiviert ist (meta.source_status="disabled").
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/CanonicalRecord"
                      - type: "null"
                  meta:
                    allOf:
                      - $ref: "#/components/schemas/Meta"
                    description: >-
                      meta trägt zusätzlich source_status ("ok"|"disabled") und
                      auf dem ok-Pfad cache_status (HIT/MISS/STALE/STALE-ON-ERROR).
        "404":
          description: Unbekannte Stadt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Quelle vorübergehend nicht erreichbar (kein Cache)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/cities/{slug}/air:
    get:
      tags: [cities]
      summary: Luftqualität je Stadt (UBA, Legacy-Pfad)
      x-summary-en: Air quality per city (UBA, legacy path)
      description: >-
        Aktuelle Luftqualitäts-Messwerte einer Stadt aus der Luftdaten-API des
        Umweltbundesamts im kanonischen Envelope. Die fünf Schadstoff-Messwerte
        (PM10, PM2.5, NO2, O3, SO2) stehen in data, Quelle und source_status in
        meta. Werte sind live (kein Zwischenbestand). Sonderfälle: deaktivierte
        Quelle liefert 200 mit data=null und source_status="disabled"; toter
        Upstream ohne Cache liefert 503 mit Hint auf GET /api/v1/health.
      x-description-en: >-
        Current air-quality readings for a city from the German Federal
        Environment Agency (UBA) air-data API in the canonical envelope. The five
        pollutant readings (PM10, PM2.5, NO2, O3, SO2) are in data, source and
        source_status in meta. Values are live (no intermediate store). Special
        cases: a disabled source returns 200 with data=null and
        source_status="disabled"; a dead upstream with no cache returns 503 with
        a hint to GET /api/v1/health.
      operationId: getCityAir
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Luftqualitäts-Envelope (CanonicalRecord oder null)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/CanonicalRecord"
                      - type: "null"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "404":
          description: Unbekannte Stadt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Quelle vorübergehend nicht erreichbar (kein Cache)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/cities/{slug}/overview:
    get:
      tags: [cities]
      summary: Stadt-Überblick (Katalog aller Datenarten + Live-Highlights)
      x-summary-en: City overview (catalog of all data types + live highlights)
      description: >-
        Ein-Aufruf-Überblick einer Stadt: Basisdaten, ein Katalog ALLER
        verfügbaren Datenarten (je mit Abdeckungsstatus und dem passenden
        MCP-Tool) sowie ein kleiner Live-Highlight-Snapshot (Wetter, Luft,
        Bahn-Abfahrten), parallel und zeitgedeckelt. Ideal als Einstieg, um die ganze Breite je
        Stadt zu sehen (nicht nur Wetter). Eine noch nicht abgedeckte Datenart
        wird ehrlich, aber vorwärts gewandt dargestellt (sie nennt die bereits
        abgedeckten Städte plus einen Roadmap-Hinweis, weil InfraNode laufend
        mehr Daten und Städte bekommt). Unbekannte Stadt liefert 404.
      x-description-en: >-
        One-call overview of a city: base data, a catalog of ALL available data
        types (each with its coverage status and the matching MCP tool), and a
        small live highlights snapshot (weather + air), fetched in parallel and
        time-capped. Ideal as an entry point to see the full breadth per city,
        not just weather. A data type that is not yet covered is shown honestly
        but forward-looking (it lists the cities where it IS available plus a
        roadmap note, because InfraNode keeps adding more data types and cities).
        An unknown city returns 404.
      operationId: getCityOverview
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Überblick-Envelope (Basis + Katalog + Highlights + Summary)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    properties:
                      city:
                        type: object
                        description: Basisdaten der Stadt (slug, Lage, Einwohner).
                      data_types:
                        type: array
                        description: >-
                          Katalog aller Datenarten je mit type, label, label_en,
                          tool (MCP-Tool), path und available; nicht abgedeckte
                          tragen zusätzlich covered_cities und einen note-Hinweis.
                        items:
                          type: object
                      highlights:
                        type: object
                        description: >-
                          Live-Snapshot je Highlight-Quelle (weather, air) mit
                          eigenem source_status (ok/no_data/disabled/error).
                      summary:
                        type: object
                        description: >-
                          data_types_total, data_types_available, cities_total,
                          eine headline (macht die verfügbare Breite in einem Satz
                          greifbar) und ein Roadmap-Hinweis (note).
                  meta:
                    $ref: "#/components/schemas/Meta"
        "404":
          description: Unbekannte Stadt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/cities/{slug}/weather:
    get:
      tags: [cities]
      summary: Wetter je Stadt (DWD über Bright Sky)
      x-summary-en: Weather per city (DWD via Bright Sky)
      description: >-
        Aktuelle Wetter-Messwerte einer Stadt vom Deutschen Wetterdienst (über
        Bright Sky) im kanonischen Envelope. data trägt die Messwerte,
        attribution den GeoNutzV-Bearbeitungshinweis (modified=true).
        Sonderfälle: deaktivierte Quelle liefert 200 mit
        source_status="disabled"; toter Upstream ohne Cache liefert 503 mit Hint
        auf GET /api/v1/health.
      x-description-en: >-
        Current weather readings for a city from the German Weather Service (DWD,
        via Bright Sky) in the canonical envelope. data holds the readings,
        attribution carries the GeoNutzV modification notice (modified=true).
        Special cases: a disabled source returns 200 with
        source_status="disabled"; a dead upstream with no cache returns 503 with
        a hint to GET /api/v1/health.
      operationId: getCityWeather
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Wetter-Envelope (CanonicalRecord oder null)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/CanonicalRecord"
                      - type: "null"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "404":
          description: Unbekannte Stadt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Quelle vorübergehend nicht erreichbar (kein Cache)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/cities/{slug}/pois:
    get:
      tags: [cities]
      summary: POIs je Stadt, nach Typ gefiltert (OSM, Tier B)
      x-summary-en: POIs per city, filtered by type (OSM, Tier B)
      description: >-
        Liefert POIs einer Stadt aus OpenStreetMap im kanonischen Envelope,
        gefiltert nach dem Query-Parameter type. Der Typ wird gegen eine feste
        Liste geprüft; ein unbekannter Typ löst 422 aus. Die Daten stammen aus
        einem periodischen Precompute (OSM-Deutschland-Extrakt, wöchentlich); die
        Route liest read-only aus dem Store, nicht live. total_available nennt den
        echten Gesamtbestand, die items-Liste ist eine gedeckelte, paginierbare
        Stichprobe. Tier B (copyleft, ODbL). Deaktiviert -> 200
        source_status="disabled"; noch kein Bestand -> 200 source_status="no_data".
      x-description-en: >-
        Returns a city's POIs from OpenStreetMap in the canonical envelope,
        filtered by the type query parameter. The type is checked against a fixed
        list; an unknown type triggers 422. Data comes from a periodic precompute
        (OSM Germany extract, weekly); the route reads read-only from the store,
        not live. total_available reports the real total, the items list is a
