  /api/v1/cities/{slug}/civil-protection-warnings:
    get:
      tags: [cities]
      summary: Amtliche BBK-NINA-Bevölkerungsschutz-Warnungen je Stadt (Tier A)
      x-summary-en: Official BBK NINA civil protection warnings per city (Tier A)
      description: >-
        Aktive amtliche Bevölkerungsschutz-Warnungen des Bundesamts für
        Bevölkerungsschutz und Katastrophenhilfe (BBK, NINA-API) für die Stadt.
        Füllt die Zivilschutz-Lücke (Gefahrstoff, Großbrand, Bombenentschärfung)
        neben weather-warnings und flood. Der Regionsbezug erfolgt über den
        12-stelligen Kreis-ARS (aus dem AGS abgeleitet); coverage_granularity
        (city|district) weist die ARS-Kreisschärfe aus. Der amtliche Warntext
        (headline) wird UNVERÄNDERT, verbatim durchgereicht (§ 5 Abs. 2 UrhG,
        keine Umformulierung/Kürzung/Übersetzung); je Warnung stehen provider
        (MOWAS/KATWARN/BIWAPP/POLICE/DWD/LHP), severity, sent, onset, expires,
        detail_url und duplicate_of (DWD -> weather-warnings, LHP -> flood).
        Quelle: BBK NINA, keylos. Deaktiviert -> 200 source_status="disabled";
        keine aktive Warnung -> 200 source_status="ok" (count 0).
      x-description-en: >-
        Active official civil protection warnings from the German Federal Office
        of Civil Protection and Disaster Assistance (BBK, NINA API) for the city.
        Fills the civil-protection gap (hazmat, major fire, bomb disposal)
        alongside weather-warnings and flood. Region mapping uses the 12-digit
        district ARS (derived from the AGS); coverage_granularity (city|district)
        states the ARS granularity. The official warning text (headline) is passed
        through VERBATIM, unchanged (§ 5 (2) UrhG, no rewording/shortening/
        translation); each warning carries provider (MOWAS/KATWARN/BIWAPP/POLICE/
        DWD/LHP), severity, sent, onset, expires, detail_url and duplicate_of
        (DWD -> weather-warnings, LHP -> flood). Source: BBK NINA, keyless.
      operationId: getCityCivilProtectionWarnings
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >-
            Warnungen-Envelope (CanonicalRecord mit CivilProtectionWarningPayload:
            ars, coverage_granularity, count, warnings) oder null bei
            source_status disabled. source_status ok/disabled.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/CanonicalRecord"
                      - type: "null"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "404":
          description: Unbekannte Stadt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Upstream (BBK NINA) nicht erreichbar, kein Cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
