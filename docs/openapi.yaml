        plus attributes (species, planting year, height, street, district). The
        attributes are canonically named species, species_botanical, genus,
        planting_year and crown_diameter_m; the equivalent raw source field names
        (e.g. art_dtsch, pflanzjahr, Baumart) were deprecated on 2026-08-01 and
