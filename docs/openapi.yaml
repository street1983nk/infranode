  /api/v1/cities/{slug}/public-tenders:
    get:
      tags: [cities]
      summary: Öffentliche Auftragsvergabe je Stadt (oeffentlichevergabe.de, Tier A)
      x-summary-en: Public procurement notices per city (oeffentlichevergabe.de, Tier A)
      description: >-
        Öffentliche Auftragsbekanntmachungen einer Stadt aus dem
        Bekanntmachungsdienst des Bundes (oeffentlichevergabe.de, OCDS): laufende
        Vergabeverfahren und entschiedene Verfahren, je Bekanntmachung Titel,
        Status, Auftraggeber, Wert und Quell-Link; bei entschiedenen Verfahren
        zusaetzlich die Auftragnehmer (suppliers, Namensliste; leer wenn die
        Quelle nicht offenlegt) und der tatsaechlich vergebene Auftragswert
        (award_value/award_currency, getrennt vom Ausschreibungswert value).
        status wird semantisch aus dem
        notice_type abgeleitet: active = laufendes Vergabeverfahren
        (Auftragsbekanntmachung), complete = entschiedenes Verfahren inkl.
        aufgehobener Vergaben; der rohe Zuschlag-Status steht im Feld
        award_status (active/pending/unsuccessful/null). Betraege <= 0 aus der Quelle werden als nicht angegeben (null) gewertet. Die Angebotsfrist
        (deadline) fehlt im Quell-Export fast immer und steht dann nur in der
        Original-Bekanntmachung über source_url. Read-only aus dem deduplizierten
        Store (kein Live-Pull im Request-Pfad). Filter status (active/complete)
        und match (buyer_city/place_of_performance), mit Pagination
        (limit/offset). Keine Bekanntmachungen -> 200 source_status="no_data",
        data=null (ehrlich). CC0 (Tier A). Deaktiviert -> 200
        source_status="disabled".
      x-description-en: >-
        A city's public procurement notices from the German federal procurement
        publication service (oeffentlichevergabe.de, OCDS): running procedures and
        decided procedures, each with title, status, buyer, value and a source
        link; decided procedures additionally carry the contractors (suppliers,
        list of names; empty when the source does not disclose them) and the
        actually awarded value (award_value/award_currency, separate from the
        tender estimate value). status is derived semantically from the notice_type: active =
        running procedure (contract notice), complete = decided procedure incl.
        cancelled awards; the raw award status is in the award_status field
        (active/pending/unsuccessful/null). Amounts of 0 or less from the source
        are treated as not stated (null). The submission deadline is almost
        always missing in the source export and then only found in the original
        notice via source_url. Read-only from the deduplicated store (no live pull
        in the request path). Filter by status (active/complete) and match
        (buyer_city/place_of_performance), with pagination (limit/offset). No
        notices -> 200 source_status="no_data", data=null (honest). CC0 (Tier A).
        Disabled -> 200 source_status="disabled".
      operationId: getCityPublicTenders
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: >-
            Verfahrens-Status (active = laufendes Vergabeverfahren, complete =
            entschiedenes Verfahren inkl. aufgehobener Vergaben; Detail im Feld
            award_status).
          schema:
            type: string
            enum: [active, complete]
        - name: match
          in: query
          required: false
          description: >-
            Stadt-Zuordnung (buyer_city = Sitz des Amts, place_of_performance =
            Erfüllungsort).
          schema:
            type: string
            enum: [buyer_city, place_of_performance]
        - name: q
          in: query
          required: false
          description: Titel-Stichwort (Teilstring, parametrisierter LIKE-Filter).
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: >-
            Nur Bekanntmachungen ab diesem ISO-Datum YYYY-MM-DD; ungültiges Datum
            -> 422.
          schema:
            type: string
            format: date
        - name: limit
          in: query
          required: false
          description: Seitengröße (Default 50, Cap 200).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          description: Seiten-Offset (>= 0); Overflow -> leere Seite, no_data.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: >-
            Auftragsvergabe-Envelope (aggregierte notices-Liste + count, oder null
            bei no_data/disabled)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    oneOf:
                      - type: object
                        properties:
