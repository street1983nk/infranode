  /api/v1/live/{city}/transit/departures:
    get:
      tags: [Live]
      summary: Live-ÖPNV-Abfahrten je Halt mit Verspätung (GTFS-RT, Tier B)
      x-summary-en: Live public-transit departures per stop with delay (GTFS-RT, Tier B)
      description: >-
        Liefert die Live-Abfahrten eines Halts mit aktueller Verspätung aus dem
        GTFS-RT-Feed (gtfs.de bzw. Mobilithek-DELFI, CC-BY-SA = Tier B) im
        Live-Envelope (meta mit as_of und refresh_seconds=45, dem Poller-Takt).
        Der Request-Pfad liest NUR aus Redis: ein Hintergrund-Poller parst den
        Feed einmal je Takt, sodass nicht bei jedem Request ein 68-MB-Feed
        geparst wird. RT-only-Semantik: ausgeliefert werden ausschliesslich
        Trips mit Echtzeit-Update; Fahrplan-Sollzeiten sind NICHT enthalten.
        Traegt ein Update eine absolute Abfahrtszeit (z.B. Berlin/VBB), wird sie
        auf Zukunft geprueft (90-s-Grace) und aufsteigend sortiert; Delay-only-
        Updates ohne absolute Zeit (Regelfall im bundesweiten Feed) kommen MIT
        delay_s/delay_min und departure_time/minutes_until = null nach den
        zeitbehafteten Eintraegen. stop_id darf Parent- ODER Steig-Ebene sein
        (de:AGS:nr bzw. de:AGS:nr:bereich:steig), beide werden aufgeloest. meta
        weist zusaetzlich raw_updates_total und filtered_out aus (ehrliche
        Rohzahlen, keine stille Kappung). Toggle aus -> 200
        source_status="disabled"; kein Update in Redis oder alles gefiltert ->
        200 source_status="no_data"; ungültige stop_id -> 400. Reine Live-Daten,
        nur im Redis-Cache gehalten (Tier B).
      x-description-en: >-
        Returns a stop's live departures with current delay from the GTFS-RT feed
        (gtfs.de or Mobilithek-DELFI, CC-BY-SA = Tier B) in the live envelope
        (meta with as_of and refresh_seconds=45, the poller cadence). The request
        path reads ONLY from Redis: a background poller parses the feed once per
        cadence, so no 68 MB feed is parsed per request. RT-only semantics: only
        trips with a realtime update are served; scheduled timetable times are
        NOT included. When an update carries an absolute departure time (e.g.
        Berlin/VBB) it is checked for the future (90 s grace) and sorted
        ascending; delay-only updates without an absolute time (the norm in the
        nationwide feed) are served WITH delay_s/delay_min and
        departure_time/minutes_until = null after the timed entries. stop_id may
        be parent or platform level (de:AGS:nr or de:AGS:nr:area:platform), both
        resolve. meta
        additionally exposes raw_updates_total and filtered_out (honest raw
        counts, no silent truncation). Toggle off -> 200
        source_status="disabled"; no update in Redis or everything filtered out
        -> 200 source_status="no_data"; invalid stop_id -> 400. Live data only,
        kept in the Redis cache (Tier B).
      operationId: getLiveTransitDepartures
      parameters:
        - name: city
          in: path
          required: true
          schema:
            type: string
            example: berlin
        - name: stop_id
          in: query
          required: true
          description: >-
            DELFI-Halt-ID im Muster de:<AGS>:<id> (gegen eine Allowlist geprüft).
            Gültige IDs je Stadt liefert GET /api/v1/cities/{slug}/transit im Feld
            stop_id. NICHT die trip_stop_id der Bahnhofstafeln, die bezeichnet
            einen Halt einer Zugfahrt.
          x-description-en: >-
            DELFI stop ID in the pattern de:<AGS>:<id> (checked against an
            allowlist). Valid ids per city come from GET
            /api/v1/cities/{slug}/transit, field stop_id. NOT the trip_stop_id of
            the station boards, which denotes one stop of one train run.
          schema:
            type: string
            example: "de:11000:900003101::6"
      responses:
        "200":
          description: Live-Abfahrten-Envelope (CanonicalRecord oder null)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/CanonicalRecord"
                      - type: "null"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "400":
          description: Ungültige oder fehlende stop_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Unbekannte Stadt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
