        Public procurement notices across ALL cities in the store from the German
        federal procurement publication service (oeffentlichevergabe.de, OCDS):
        searches nationwide without querying each city individually. Each notice
        with title, status, buyer, value and a source link. status is derived
        semantically from the notice_type: active = running procedure, complete =
        decided procedure incl. cancelled awards; the raw award status is in the
        award_status field. Decided procedures additionally carry contractors
        (suppliers) and the awarded value (award_value/award_currency); amounts of
        0 or less from the source are treated as not stated (null). The
        submission deadline is almost always missing in
        the source export and then only found in the original notice via
        source_url. Read-only from the deduplicated store (no live pull in the
        request path). Filter by q (title keyword), status (active/complete) and
        since (from ISO date), with pagination (limit/offset). No notices -> 200
        source_status="no_data", data=null (honest). CC0 (Tier A). Disabled -> 200
        source_status="disabled".
