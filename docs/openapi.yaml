  /api/v1/cities/{slug}/solar:
    get:
      tags: [cities]
      summary: Solar-Einstrahlung + PV-Ertrag je Stadt (PVGIS, Tier A)
      x-summary-en: Solar irradiation + PV yield per city (PVGIS, Tier A)
      description: >-
        Solar-Potenzial je Stadt aus der keylosen PVGIS-Rechen-API (EU JRC,
        PVcalc). PVGIS rechnet jede EU-Koordinate, daher sind alle Städte
        abgedeckt. Klimatologisches Mehrjahresmittel am Stadtzentrum, normiert auf
        1 kWp bei optimalem Neigungswinkel: annual_yield_kwh_kwp (Jahresertrag
        kWh/kWp), annual_irradiation_kwh_m2 (Globalstrahlung kWh/m²),
        optimal_slope_deg/optimal_azimuth_deg und 12 Monatswerte (monthly).
        system_loss_pct ist der konfigurierte (gewollte) Systemverlust aus
        Verkabelung/Wechselrichter/Verschmutzung (an PVGIS übergebener
        loss-Parameter, i.d.R. 14 %), NICHT die Gesamt-Performance-Differenz;
        diese steht separat als total_performance_delta_pct (PVGIS l_total, inkl.
        Temperatur-/Einstrahlungs-/Winkel-Effekten, negativ = Gesamtminderung).
        Kein Messzeitpunkt, daher observed_at=null; der Bezugszeitraum steht als
        period_start/period_end. Tier A (EU-Reuse-Policy). Toggle aus -> 200
        source_status="disabled"; toter Upstream ohne Cache -> 503 mit Hint.
      x-description-en: >-
        Solar potential per city from the keyless PVGIS computation API (EU JRC,
        PVcalc). PVGIS computes any EU coordinate, so all cities are covered. A
        multi-year climatological average at the city centre, normalized to a
        1 kWp system at the optimal tilt: annual_yield_kwh_kwp (annual yield
        kWh/kWp), annual_irradiation_kwh_m2 (global irradiation kWh/m²),
        optimal_slope_deg/optimal_azimuth_deg and 12 monthly values (monthly).
        system_loss_pct is the configured (intended) system loss from
        cabling/inverter/soiling (the loss parameter passed to PVGIS, typically
        14 %), NOT the overall performance delta; that is carried separately as
        total_performance_delta_pct (PVGIS l_total, incl. temperature/irradiance/
        angle effects, negative = overall reduction). No observation timestamp, so
        observed_at=null; the reference period is carried as
        period_start/period_end. Tier A (EU reuse policy). Toggle off -> 200
        source_status="disabled"; dead upstream with no cache -> 503 with a hint.
      operationId: getCitySolar
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Solar-Envelope (CanonicalRecord mit SolarPayload) oder null.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/CanonicalRecord"
                      - type: "null"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "404":
          description: Unbekannte Stadt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/cities/{slug}/parking:
    get:
      tags: [cities]
      summary: Parkhaus-Belegung/-Katalog je Stadt (EIN Endpunkt mit Quellen-Fallback)
      x-summary-en: Parking occupancy/catalogue per city (one endpoint, source fallback)
      description: >-
        Parkhaus-Daten je Stadt aus EINEM Endpunkt mit Quellen-Fallback (Dedup):
        bevorzugt ParkenDD-Live-Belegung (frei/gesamt je Parkhaus, 13 Städte mit
        verifiziert offener Lizenz, keylos), für München der statische
        Open-Data-Standortkatalog (DL-DE/BY 2.0, ohne Live-Belegung), für
        Frankfurt am Main, Wuppertal und Magdeburg die Mobilithek-Quellen der
        Städte (DATEX II, Live-Belegung + Stammdaten, DL-DE/BY bzw. DL-DE/Zero). Lizenz/Tier
        kommen pro Datensatz aus der am Ursprung verifizierten Quelle (alle Tier A:
        z.B. Köln/Dortmund DL-DE/Zero 2.0, Hamburg DL-DE/BY 2.0, Aachen/Ulm CC0,
        Karlsruhe/Heidelberg CC BY 4.0). Löst den deprecateten
        Pfad /api/v1/live/dortmund/parking ab. Toggle aus -> 200
        source_status="disabled"; nicht-abgedeckte Stadt -> 200
        source_status="not_covered" (mit covered_cities); abgedeckte Stadt ohne
        Parkhaus -> 200 source_status="no_data". Staleness-Guard: ist der
        ParkenDD-Datenstand (last_updated) aelter als 48 Stunden (eingefrorener
        Upstream, z.B. Koeln seit 2021), antwortet die Stadt ehrlich mit
        source_status="no_data" statt einer veralteten "Live"-Belegung;
        liefert der Ursprung wieder, kippt sie automatisch auf ok zurueck.
      x-description-en: >-
        Per-city parking data from ONE endpoint with a source fallback (dedup):
        prefers ParkenDD live occupancy (free/total per facility, 13 cities with a
        verified open license, key-less), and for Munich the static open-data
        location catalogue (DL-DE/BY 2.0, no live occupancy), and for Frankfurt,
        Wuppertal and Magdeburg the cities own Mobilithek sources (DATEX II,
        live occupancy + master data, DL-DE/BY or DL-DE/Zero). License/tier are per
        record from the source verified at origin (all Tier A: e.g. Cologne/Dortmund
        DL-DE/Zero 2.0, Hamburg DL-DE/BY 2.0, Aachen/Ulm CC0, Karlsruhe/Heidelberg
        CC BY 4.0). Supersedes the
        deprecated path /api/v1/live/dortmund/parking. Toggle off -> 200
        source_status="disabled"; city not covered -> 200
        source_status="not_covered" (with covered_cities); covered city without a
        parking facility -> 200 source_status="no_data". Staleness guard: if the
        ParkenDD data timestamp (last_updated) is older than 48 hours (frozen
        upstream, e.g. Cologne since 2021), the city honestly answers with
        source_status="no_data" instead of an outdated "live" occupancy; once
        the origin delivers again, it automatically flips back to ok.
      operationId: getCityParking
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Parking-Envelope (CanonicalRecord mit ParkingPayload) oder null.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/CanonicalRecord"
                      - type: "null"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "404":
          description: Unbekannte Stadt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
