  /api/v1/cities/{slug}/charging-status:
    get:
      tags: [cities]
      summary: Live-Ladesäulen-Belegung je Stadt (eRound, CC0/Tier A)
      x-summary-en: Live EV charging occupancy per city (eRound, CC0/Tier A)
      description: >-
        Liefert die aggregierte Live-Ladesäulen-Belegung einer Stadt (eRound
        AFIR-Recharging, DATEX-II V3, CC0) im kanonischen Envelope. Join aus
        zwei Zuständen, kein Upstream-Abruf im Request: der statische
        eRound-Standort-Vollbestand liefert die Zuordnung Ladepunkt -> Stadt
        + Koordinaten (täglicher Ingest, alle 84 Städte abgedeckt), der
        dynamische Belegungs-Feed wird als Delta-Strom akkumuliert (Status je
        Ladepunkt, Staleness-Fenster 24 h). Payload: total_points (bekannte
        Ladepunkte im Stadtumkreis), reported_points (davon mit frischem
        Live-Status), status_counts (available/occupied/charging/unavailable
        u. a.) sowie die Einzelpunkte (refill_point_id, lat/lon, status,
        observed_at; Liste auf 500 gekappt, truncated markiert ehrlich).
        Quelle deaktiviert -> 200 source_status="disabled"; noch kein
        akkumulierter Live-Status -> 200 source_status="no_data".
      x-description-en: >-
        Returns a city's aggregated live EV charging occupancy (eRound AFIR
        recharging, DATEX-II V3, CC0) in the canonical envelope. A join of
        two states with no upstream call at request time: the static eRound
        location inventory maps each charging point to a city + coordinates
        (daily ingest, all 84 cities covered), while the dynamic occupancy
        feed is accumulated as a delta stream (status per charging point,
        24 h staleness window). Payload: total_points (known charging points
        within the city radius), reported_points (of which with a fresh live
        status), status_counts (available/occupied/charging/unavailable
        etc.) plus the individual points (refill_point_id, lat/lon, status,
        observed_at; list capped at 500, truncated flags honestly).
        Source disabled -> 200 source_status="disabled"; no accumulated
        live status yet -> 200 source_status="no_data".
      operationId: getCityChargingStatus
      parameters:
        - name: slug
          in: path
          required: true
          schema:
