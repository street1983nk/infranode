        Normalized public-transit stops for a city from the nationwide DELFI GTFS
        feed or the HVV feed in the canonical envelope. The data is prepared
        offline and kept as a per-city snapshot, so the request responds quickly
        without parsing the feed per request. Special cases: if both sources are
        disabled it returns 200 with source_status="disabled"; if no snapshot
        exists yet it returns 200 with source_status="not_ingested" and empty
        data, never a 5xx. Use q (name search) or near (proximity search) to
        find specific stops instead of fetching the full list.
      operationId: getCityTransit
