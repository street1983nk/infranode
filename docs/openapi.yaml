      x-summary-en: Live departure board for a city's main station, all categories (DB Timetables, Tier A)
      description: >-
        Nächste Zugabfahrten am Haupt-Bahnhof der Stadt mit Echtzeit-Verspätung:
        Sollfahrplan (/plan) und aktuelle Abweichungen (/fchg) der
        DB-Timetables-API, je Bahnhof zu einer nach Abfahrt sortierten Liste
        zusammengeführt (line, category, destination, planned_time mit Zeitzone,
        platform, delay_minutes, cancelled, long_distance). trip_stop_id
        bezeichnet EINEN HALT EINER ZUGFAHRT und ist KEINE Haltestellen-ID; fuer
        /api/v1/live/{slug}/transit/departures wird die DELFI-ID aus
        /api/v1/cities/{slug}/transit gebraucht. Das gleichwertige stop_id ist
        abgekuendigt. Volle Abdeckung über alle 84
        Städte: der Haupt-Bahnhof wird automatisch aus dem amtlichen StaDa-Katalog
        abgeleitet (für die großen Knoten eine verifizierte Auswahl). Quelle:
        Deutsche Bahn AG (CC BY 4.0). Ohne Zugangsdaten ODER Toggle aus -> 200
        source_status="disabled"; keine Abfahrt im Zeitfenster -> 200
        source_status="no_data". Ein einzelner gestörter Bahnhof wird
        übersprungen und die Tafel aus den erreichbaren Bahnhöfen gebaut;
        erst wenn alle Bahnhöfe gestört sind und kein Cache vorliegt ->
        503 upstream_unavailable. Für einen bestimmten Bahnhof statt der
        Stadt-Auswahl dient /api/v1/stations/{eva}/departures.
      x-description-en: >-
        Upcoming train departures at a city's main station with real-time delays:
        scheduled timetable (/plan) and current changes (/fchg) of the DB
        Timetables API, merged per station into a list sorted by departure (line,
        category, destination, planned_time, platform, delay_minutes, cancelled,
        long_distance). Full coverage across all 84 cities: the main station is
        derived automatically from the official StaDa catalog (a verified pick for
        the major hubs). Source: Deutsche Bahn AG (CC BY 4.0). Without credentials
        OR toggle off -> 200 source_status="disabled"; no departure in the window ->
        200 source_status="no_data". A single disrupted station is skipped and the
        board is built from the reachable stations; only if every station fails
        and no cache is available -> 503 upstream_unavailable. To target a
        specific station instead of the city's pick, use
        /api/v1/stations/{eva}/departures.
      operationId: getCityStationDepartures
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Abfahrts-Envelope (CanonicalRecord mit StationDeparturesPayload) oder null.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/CanonicalRecord"
                      - type: "null"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "404":
          description: Unbekannte Stadt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
