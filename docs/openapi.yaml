      summary: Öffentliche Auftragsvergabe deutschlandweit (oeffentlichevergabe.de, Tier A)
      x-summary-en: Public procurement notices nationwide (oeffentlichevergabe.de, Tier A)
      description: >-
        Öffentliche Auftragsbekanntmachungen über ALLE Städte im Store aus dem
        Bekanntmachungsdienst des Bundes (oeffentlichevergabe.de, OCDS): sucht
        deutschlandweit, ohne jede Stadt einzeln abzufragen. Je Bekanntmachung
        Titel, Status, Auftraggeber, Wert und Quell-Link. status wird semantisch
        aus dem notice_type abgeleitet: active = laufendes Vergabeverfahren,
        complete = entschiedenes Verfahren inkl. aufgehobener Vergaben; der rohe
        Zuschlag-Status steht im Feld award_status. Entschiedene Verfahren tragen
        zusaetzlich Auftragnehmer (suppliers) und vergebenen Auftragswert
        (award_value/award_currency); Betraege <= 0 aus der Quelle werden als
        nicht angegeben (null) gewertet. Die Angebotsfrist (deadline)
        fehlt im Quell-Export fast immer und steht dann nur in der
        Original-Bekanntmachung über source_url. Read-only aus dem deduplizierten
        Store (kein Live-Pull im Request-Pfad). Filter q (Titel-Stichwort), status
        (active/complete) und since (ab ISO-Datum), mit Pagination (limit/offset).
