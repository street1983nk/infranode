        Datenarten); das gleichwertige title ist zum 2026-08-31 abgekündigt und
        wird frühestens am 2026-09-30 entfernt (die frühere Ankündigung vom
        2026-08-01 hatte den Nachfolger für diese Quelle nie ausgeliefert,
        darum läuft eine neue Frist).
        Vergangene Termine werden herausgefiltert. Sonderfälle: ist die Quelle
        aus oder fehlt der licensekey, kommt 200 mit source_status="disabled";
        liefert die Quelle nichts Aktuelles, kommt 200 mit
        source_status="no_data"; toter Upstream ohne Cache liefert 503 mit Hint.
      x-description-en: >-
        Current and upcoming events for a city from the account-bound source
        destination.one/eT4.META in the canonical envelope. The license is
        derived per record from the license field (CC0/CC-BY, CC-BY-SA, otherwise
        unknown) and mirrored in attribution. The event name is canonically
        called name (as in all other data types); the equivalent title is
        deprecated as of 2026-08-31 and will be removed no earlier than
        2026-09-30 (the earlier announcement of 2026-08-01 never shipped the
        successor for this source, hence a fresh window). Past dates are
        filtered out.
        Special cases: if the source is off or the licensekey is missing it
        returns 200 with source_status="disabled"; if the source has nothing
        current it returns 200 with source_status="no_data"; a dead upstream with
        no cache returns 503 with a hint.
