        Energie-Atlas Bayern, CC BY 4.0; Berlin: Umweltatlas/SenMVKU, DL-DE/Zero 2.0;
        Hamburg: LGV solar potential analysis, DL-DE/BY 2.0). Returns the total
        installable rooftop PV potential (potential_kwp, potential_yield_mwh), the
        already installed stock (installed_kwp, installed_yield_mwh), the
        exploitation ratio (exploitation_pct) and the potential broken down per
        building category (potential_by_category). Coverage varies by source (e.g.
