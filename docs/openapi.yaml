  /api/v1/cities/{slug}/traffic:
    get:
      tags: [cities]
      summary: Baustellen und Verkehrsmeldungen je Stadt (Autobahn-API)
      x-summary-en: Roadworks and traffic warnings per city (Autobahn API)
      description: >-
        Baustellen (roadworks) und Verkehrswarnungen (warnings) im Umfeld einer
        Stadt aus der Autobahn-API im kanonischen Envelope. Die Meldungen werden
        per Bounding-Box um die Stadt-Koordinaten gefiltert, data enthält die
        passenden Einträge. Flächendeckend: jeder der 84 Städte sind die nahen
        Autobahnen kuratiert zugeordnet (datengetrieben aus der Autobahn-API),
        eine Stadt ohne aktuelle Meldung antwortet ehrlich mit no_data.
        Stau/Verkehrslage:
        jede Verkehrswarnung trägt zusätzlich ein congestion-Feld (level
        stau/stockend/dicht/unspezifisch aus dem DATEX-abnormalTrafficType,
        delay_minutes = Reisezeitverlust, blocked), und payload.congestion_summary
        verdichtet die Stau-Lage je Stadt (count/stau/stockend/blocked/
        max_delay_minutes; null wenn keine Stau-Meldung). Geometrie: die Antwort
        ist per Default schlank (die Roh-Polyline je Meldung ist weggelassen); mit
        include=geometry (oder ?full=1) bleibt das geometry-Feld in roadworks und
        warnings erhalten. Feldnamen: jedes Ereignis trägt die Werte zusätzlich in
        der API-Konvention (is_blocked als echtes Boolean, start_timestamp,
        delay_minutes, average_speed_kmh, abnormal_traffic_type, name,
        description_text sowie bbox/lat/lon aus extent); die sechs camelCase-Rohfelder des Autobahn-Feeds
        mit kanonischem Nachfolger (isBlocked, extent, startTimestamp,
        delayTimeValue, averageSpeed, abnormalTrafficType) waren zum 2026-08-01
        abgekündigt und sind seit dem 2026-08-31 entfernt. Weitere Sonderfälle:
        deaktivierte Quelle liefert 200 mit source_status="disabled"; toter
        Upstream ohne Cache liefert 503 mit Hint auf GET /api/v1/health.
      x-description-en: >-
        Roadworks and traffic warnings around a city from the Autobahn API in the
        canonical envelope. Items are filtered by a bounding box around the
        city's coordinates; data contains the matching entries. Full coverage:
        each of the 84 cities has its nearby motorways curated (data-driven from
        the Autobahn API); a city with no current message honestly responds with
        no_data. Congestion: each traffic warning additionally carries a
        congestion field (level stau/stockend/dicht/unspezifisch derived from the
        DATEX abnormalTrafficType, delay_minutes = travel-time loss, blocked), and
        payload.congestion_summary aggregates the congestion situation per city
        (count/stau/stockend/blocked/max_delay_minutes; null if no congestion
        message). the six camelCase raw fields of the
        Autobahn feed that have a canonical successor (isBlocked, extent,
        startTimestamp, delayTimeValue, averageSpeed, abnormalTrafficType) were
        deprecated on 2026-08-01 and have been removed as of 2026-08-31. Other special cases: a disabled source returns 200
        with source_status="disabled"; a dead upstream with no cache returns 503
        with a hint to GET /api/v1/health.
      operationId: getCityTraffic
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: include
          in: query
          required: false
          description: >-
            Feld-Opt-in: include=geometry behält die Roh-Polyline (geometry) je
            roadwork/warning; Default ist schlank (geometry weggelassen).
          x-description-en: >-
            Field opt-in: include=geometry keeps the raw polyline (geometry) per
            roadwork/warning; default is slim (geometry omitted).
          schema:
            type: string
            enum: [geometry]
        - name: full
          in: query
          required: false
          description: >-
            Äquivalentes Flag zu include=geometry (?full=1 behält die Polyline).
          x-description-en: >-
            Equivalent flag to include=geometry (?full=1 keeps the polyline).
          schema:
            type: boolean
      responses:
        "200":
          description: Verkehrs-Envelope (CanonicalRecord oder null)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/CanonicalRecord"
                      - type: "null"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "404":
          description: Unbekannte Stadt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Quelle vorübergehend nicht erreichbar (kein Cache)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/cities/{slug}/transit:
    get:
      tags: [cities]
      summary: ÖPNV-Haltestellen je Stadt (DELFI und HVV GTFS)
      x-summary-en: Public-transit stops per city (DELFI and HVV GTFS)
      description: >-
        Normalisierte ÖPNV-Haltestellen einer Stadt aus dem bundesweiten
        DELFI-GTFS-Feed bzw. dem HVV-Feed im kanonischen Envelope. Die Daten
        werden offline aufbereitet und als Snapshot je Stadt gehalten, sodass der
        Abruf schnell antwortet, ohne den Feed pro Request zu parsen.
        Sonderfälle: sind beide Quellen deaktiviert, kommt 200 mit
        source_status="disabled"; liegt noch kein Snapshot vor, kommt 200 mit
        source_status="not_ingested" und leeren data, nie ein 5xx.
        Mit q (Namenssuche) oder near (Umkreissuche) lassen sich gezielt
        einzelne Haltestellen finden, statt die Vollliste abzurufen.
