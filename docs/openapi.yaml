    CanonicalRecord:
      type: object
      required: [city_slug, retrieved_at, source, license_id, license_tier, schema_version, record_id, content_hash, attribution, payload]
      properties:
        city_slug:
          type: string
        schema_version:
          type: integer
          default: 1
        record_id:
          type: string
          description: Deterministischer Primärschlüssel (computed, immer im Dump).
        content_hash:
          type: string
          description: Deterministischer Dedup-Hash der Nutzdaten (computed, immer im Dump).
        ags:
          type: string
          nullable: true
          description: Amtlicher Gemeindeschlüssel als Join-Key (kein Pfadsegment).
        wikidata_qid:
          type: string
          nullable: true
          description: Wikidata-QID als Join-Key.
        geo:
          nullable: true
          type: object
          properties:
            lat:
              type: number
            lon:
              type: number
        observed_at:
          type: string
          format: date-time
          nullable: true
        retrieved_at:
          type: string
          format: date-time
        source:
          type: string
          description: >-
            Kanonischer Quellname (SourceId). Seit 2026-08-01 tragen alle
            Quellen einheitlich englische Namen; historische Antworten und
            Bestandsdaten konnten davor alte deutsche Quellnamen tragen
            (z.B. hamburg_baustellen statt hamburg_roadworks). Die
            vollständige Zuordnungstabelle alt -> neu steht im Changelog
            (Eintrag 2026-08-01).
          x-description-en: >-
            Canonical source name (SourceId). Since 2026-08-01 all sources
            carry uniform English names; historical responses and stored
            records may still carry the former German source names (e.g.
            hamburg_baustellen instead of hamburg_roadworks). The full
            old -> new mapping table is in the changelog (entry 2026-08-01).
          enum: [wikidata, dwd, osm, autobahn, bnetza, uba, delfi, hvv, pegelonline, lhp, dwd_pollen, dwd_fire, eea_bathing, klinik_atlas, db_fasta, genesis, zensus, mastr, smard, dwd_warnings, bkg, bundeswahl, holidays, berlin_viz, hamburg_roadworks, koeln_road_events, muenchen_roadworks, dortmund_roadworks, rostock_roadworks, sperrinfosys, mobidata_bw, destination_one, koeln_events, koeln_traffic_flow, koeln_roadworks_live, koeln_incidents_live, koeln_lez_live, berlin_traffic_reports, dortmund_parking, kiel_counting_stations, eround_charging, frankfurt_parking, wuppertal_parking, magdeburg_parking, koeln_parking, gtfs_rt, hvv_geofox, vgn, rmv, vrr, vvs, hamburg_traffic_situation, kba, unfallatlas, tankerkoenig, bremen_roadworks, hannover_traffic_reports, gbfs, inkar, wegweiser, bka_pks, db_timetables, boris, stada, regionalstatistik, solar, solar_cadastre, muenchen_parking, muenchen_bike_counts, muenchen_parking_onstreet, muenchen_park_and_ride, muenchen_mobility_points, muenchen_bike_parking, leipzig_bike_counts, hamburg_bike_counts, berlin_bike_counts, stuttgart_bike_counts, koeln_bike_counts, essen_bike_counts, duesseldorf_bike_counts, parkendd, heritage, tree_cadastre, zensus_grid, oeffentlichevergabe, district_heating, koeln_wait_times, bbk_nina, council, mobidata_parkapi, pr_hessen_parking, db_bahnpark, muenster_parking, aachen_parking, oldenburg_parking, kaiserslautern_parking, dresden_parking, karlsruhe_parking, hamburg_parking]
        license_id:
          type: string
          enum: [cc0, cc_by_4_0, dl_de_by_2_0, dl_de_zero_2_0, geonutzv, odbl, cc_by_sa_4_0, unknown]
