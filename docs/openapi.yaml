components:
  headers:
    ETag:
      description: >-
        Stabiler Entity-Tag des Response-Bodys (sha256-basiert). Nur auf
        erfolgreichen GET-Reads (200) gesetzt, nie auf Fehler-Envelopes/503.
      schema: { type: string }
    CacheControl:
      description: >-
        Cache-Control je Ressource ("public, max-age=<ttl>,
        stale-while-revalidate=<ttl>, stale-if-error=<ttl>"). TTL aus der
        serverseitigen CACHE_TTL-Map (z.B. wikidata 86400 s, dwd 1800 s, uba
        600 s, default 300 s). stale-while-revalidate/stale-if-error erlauben
        einem Shared Cache (Cloudflare), bei Ablauf bzw. Origin-Fehler kurz die
        letzte gute Antwort weiterzuliefern. Echtzeit-Endpunkte (/api/v1/live/*)
        liefern stattdessen "no-store".
      schema: { type: string }
    RateLimitLimit:
      description: Erlaubte Requests im aktuellen Fenster (IETF RateLimit-Header).
      schema: { type: integer }
    RateLimitRemaining:
      description: Verbleibende Requests im aktuellen Fenster.
      schema: { type: integer }
    RateLimitReset:
      description: Sekunden bis zum Reset des Fensters.
      schema: { type: integer }
  responses:
    NotModified:
      description: >-
        Not Modified. If-None-Match stimmte mit dem aktuellen ETag überein;
        es wird kein Body geliefert (ETag + Cache-Control bleiben erhalten).
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
  schemas:
    Meta:
      type: object
      properties:
        correlation_id:
          type: string
          nullable: true
        source_status:
          type: string
          description: >-
            Ehrlicher Quellen-Status der Antwort. "ok" (Daten vorhanden),
            "no_data" (Quelle erreichbar/abgedeckt, aber gerade keine Daten),
            "disabled" (Quelle per Toggle aus), "not_ingested" (kein Snapshot),
            "not_covered" (Stadt ist für diesen teilabgedeckten Endpunkt
            strukturell nicht abgedeckt; data=null, siehe covered_cities). Klar
            unterscheidbar vom 404 (Stadt unbekannt).
          enum: [ok, no_data, disabled, not_ingested, not_covered]
        cache_status:
          type: string
          nullable: true
          description: Cache-Herkunft (hit/miss/stale), sofern die Route cacht.
        covered_cities:
          type: array
          items:
            type: string
          description: >-
            Nur bei source_status="not_covered": die Stadt-Slugs, die dieser
            teilabgedeckte Endpunkt tatsächlich bedient (z. B. flood, webcams,
            traffic, road-events).
        pagination:
          type: object
          description: >-
            Bei paginierbaren Datenart-Listen (charging, energy, events, transit,
            OSM-Feature-Endpunkte): der EHRLICH ausgewiesene Ausschnitt (keine
            stille Kappung). KANAL-ABHÄNGIGER Default für gleiche URL:
            direktes REST liefert die volle Liste (limit=null, returned==total,
            truncated=false); GPT-Actions (erkannt am OpenAI-Header) bekommen ein
            serverseitig gebundenes Default-Limit; MCP-Aufrufe sind gebunden, weil
            der MCP-Client selbst ein Default-Limit setzt. Kanalunabhängige
            Overrides: limit=all (oder ?all=1) erzwingt die volle Liste, limit +
            offset blättern gezielt. meta.pagination ist bei ALLEN Kanälen gesetzt.
          x-description-en: >-
            For paginable data-type lists (charging, energy, events, transit, OSM
            feature endpoints): the honestly reported slice (no silent capping).
            CHANNEL-DEPENDENT default for the same URL: direct REST returns the
            full list (limit=null, returned==total, truncated=false); GPT Actions
            (detected via the OpenAI header) get a server-side bound default limit;
            MCP calls are bound because the MCP client sets a default limit itself.
            Channel-independent overrides: limit=all (or ?all=1) forces the full
            list, limit + offset page explicitly. meta.pagination is set on ALL
            channels.
          properties:
            total:
              type: integer
              description: Gesamtzahl der Einträge (voller Bestand).
            returned:
              type: integer
              description: Zahl der auf dieser Seite ausgelieferten Einträge.
            limit:
              type: integer
              nullable: true
              description: >-
                Angewandtes Seiten-Limit; null bei Vollausgabe (REST-Default oder
                limit=all).
            offset:
              type: integer
              description: Start-Offset der Seite.
            truncated:
              type: boolean
              description: >-
                true, wenn hinter dieser Seite noch Einträge liegen (offset +
                returned < total); bei Vollausgabe false.
    Health:
      type: object
      required: [status, version, redis]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: "1.0.0"
        redis:
          type: boolean
          description: true wenn Redis erreichbar (Ping erfolgreich)
    Ping:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [pong]
