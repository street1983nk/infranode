        Lastenradanlagen getrennt, largest_facilities die zwanzig groessten
        Standorte mit Ort, Plaetzen, Bauform und Merkmalen (time_limit als
        Freitext der Quelle). GEZAEHLT WIRD NUR DER BESTAND: geplante, abgebaute
        und ausser Betrieb genommene Anlagen fuehrt die Quelle im selben Layer
        und stehen als planned_facilities/planned_spaces, removed_facilities und
        out_of_service_facilities daneben, gehen aber nicht in spaces_total ein.
