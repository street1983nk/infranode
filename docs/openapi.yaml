        street, house_number, post_code, place als gemeldete Adresse; post_code ist
        immer ein fünfstelliger String. Meldet die Quelle keine eigene Hausnummer,
        wird eine im Straßennamen enthaltene Nummer abgetrennt; Tankstellen ohne
        Hausnummer behalten house_number null. Fehlt eine Angabe upstream, ist das
        Feld null). Quelle:
        Markttransparenzstelle für Kraftstoffe
        (MTS-K) via Tankerkönig (CC BY 4.0). Ohne API-Key ODER Toggle aus -> 200
        source_status="disabled"; keine Tankstelle im Radius -> 200
        source_status="no_data".
        Zwischenspeicherung: das Frische-Fenster folgt dem Tagesverlauf der
        Preise (Kraftstoffpreisanpassungsgesetz, seit 2026-04-01: Erhöhungen
        nur einmal je Kalendertag um 12:00 Uhr Europe/Berlin, Senkungen
        jederzeit) und endet immer spätestens um 11:50 Uhr, damit kein Preis
        von vor dem Mittag als frisch gilt. Ein bereits abgefragter Stand
        bleibt bis zu 24 Stunden lieferbar und trägt dann cache_status STALE.
        data.retrieved_at nennt immer den Zeitpunkt des Abrufs bei der Quelle,
        nicht den der Antwort.
      x-description-en: >-
        Current fuel prices around the city coordinate, aggregated into a
        city-level metric: average and minimum price per fuel grade (e5/e10/diesel,
        EUR/litre) across the open stations, plus station_count/open_count and the
        individual stations (stations: each carries station_id, name, brand, e5, e10,
        diesel, is_open, dist_km, lat/lon for map display plus street, house_number,
        post_code, place as the reported address; post_code is always a
        five-character string. When the source reports no separate house number, a
        number contained in the street name is split off; stations without a house
        number keep house_number null. A field is null when the upstream record
        omits it). Source: German fuel price
        transparency unit (MTS-K)
        via Tankerkönig (CC BY 4.0). Without an API key OR toggle off -> 200
        source_status="disabled"; no station in radius -> 200 source_status="no_data".
        Caching: the freshness window follows the daily price pattern (German
        fuel price adjustment act, in force since 2026-04-01: increases only
        once per calendar day at 12:00 Europe/Berlin, decreases at any time)
        and always ends at 11:50 at the latest, so no price from before noon
        counts as fresh. A value already fetched stays available for up to 24
        hours and then carries cache_status STALE. data.retrieved_at always
        names the time of the upstream fetch, not the time of the response.
      operationId: getCityFuelPrices
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Spritpreis-Envelope (CanonicalRecord mit FuelPricePayload) oder null.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/CanonicalRecord"
                      - type: "null"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "404":
          description: Unbekannte Stadt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: >-
            Quelle vorübergehend nicht erreichbar (kein Cache) ODER die
            Aggregat-Bremse der Quelle hat abgewiesen. Tankerkönig erlaubt
            1 Anfrage/Minute für alle Städte zusammen; liegt für die Stadt
            kein Zwischenstand vor (Frische je Tageszeit, danach bis zu 24
            Stunden stale mit cache_status STALE), wartet höchstens EINE
            Anfrage je Quelle auf den nächsten freien Slot (bis zu 20
            Sekunden, daher
            kann diese Antwort entsprechend später kommen). Jede weitere
            gleichzeitige Anfrage wird sofort mit 503 abgewiesen, statt sich
            anzustellen. Im Bremsen-Fall trägt die Antwort einen
            Retry-After-Header mit den Sekunden bis zum nächsten freien Slot;
            ein 503 ohne Retry-After ist ein echter Ausfall der Quelle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
